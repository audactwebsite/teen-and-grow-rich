  standfirst: You do not need permission to begin learning. You do need wisdom about risk.
  paragraphs:
  - You now have fifteen principles. That is more than enough. The danger is turning them into another
    collection of saved quotes.
  - Choose one direction. Build one skill. Make one proof project. Ask one real person what they need.
    Improve the result. That loop can take you further than a year of trying to look successful.
  - 'Napoleon Hill wrote for a different era, but the strongest question still survives: what happens
    when a person organizes their thoughts, skills, decisions, relationships, and effort around a clear
    purpose? This book''s answer is not guaranteed wealth. It is increased agency - more ability to create,
    choose, earn, help, and recover.'
  - Your first version may be awkward. Good. Awkward means it exists. The website can be simple. The offer
    can be tiny. The audience can be five people. The first payment can be modest. The first lesson can
    be expensive in time and cheap in money.
  - Keep your receipts. Stay honest. Protect your health. Let adults help with the parts that require
    adult responsibility. Build something useful enough that another person can feel the difference.
  - That is how "grow rich" becomes more than a title.
  closingLine: START TINY. STAY HONEST. BUILD RECEIPTS.
