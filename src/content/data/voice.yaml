  standfirst: 'Real talk: I am not writing this from the finish line.'
  paragraphs:
  - I started this project because I found a strange gap. Adults kept recommending powerful books about
    success, but the language often felt like it came from another planet. The principles were interesting.
    The examples were not my world.
  - My world is building websites with AI, learning from tutorials, dealing with school, wanting freedom,
    getting distracted, comparing myself, starting things too big, and trying to turn ideas into something
    real. I wanted a book that kept the strongest ideas but removed the dust, hype, and fake certainty.
  - This version is shorter on purpose. You should be able to finish it. More importantly, you should
    be able to use it. The chapters do not promise that thinking makes money appear. They show how clear
    goals, useful skills, decisions, persistence, teamwork, attention, and basic money habits can increase
    your options.
  - Do not read this like homework. Pick one chapter. Do the 24-hour build. Save the proof. Then continue.
    Your future is not built by how inspired you feel while reading. It is built by what exists after
    you close the book.
