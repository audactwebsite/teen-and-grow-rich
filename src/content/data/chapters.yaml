- id: game-plan
  n: 6
  slug: game-plan
  title: Game Plan
  eyebrow: 'CHAPTER 06 / HILL REMIX: ORGANIZED PLANNING'
  subtitle: Trade the giant to-do list for a short sprint that can actually finish.
  hillPrinciple: Organized Planning
  printedPage: 25
  hillIdea:
    term: Organized Planning
    text: Choose one outcome, map the milestones, and review the plan every week.
  story:
  - Maya and Noah's project looks like a business from the outside.
  - They have a logo, four social accounts, a color system, and a Notion board with eighty-three tasks.
    What they do not have is a T-shirt.
  - When a friend asks, "Can I actually buy anything yet?" the answer is still no.
  - 'A teacher looks at their board and asks one brutal question: "What must be true twelve weeks from
    now?"'
  - 'After arguing for twenty minutes, they choose one outcome: twenty people have tested or pre-ordered
    one sustainable T-shirt design.'
  - Most of the board gets deleted.
  - 'Weeks one to three: talk to potential buyers. Weeks four to six: make one sample and calculate the
    real cost. Weeks seven to nine: photograph it and open pre-orders. Weeks ten to twelve: produce only
    what people ordered.'
  - The first sample costs so much that their planned price makes no sense. For one evening, the whole
    idea feels dead. Then they simplify the print, find a local supplier with adult help, and explain
    the new price honestly.
  - They finish the sprint with fourteen paid pre-orders. Six short of the goal. Fourteen more than the
    logo ever produced.
  - Their plan did not predict the future. It forced the important problems to arrive early enough to
    solve.
  hillRemix: Hill's Organized Planning turns desire into coordinated action. The modern teen version should
    be flexible, not corporate. A good plan makes the next week obvious, includes feedback, and changes
    when reality teaches you something.
  whatItMeansNow: Planning apps can become a form of procrastination. A beautiful Notion board is not
    progress unless tasks move to done. Plan only enough to act. Then review what happened and rewrite
    the next week.
  play:
  - n: 1
    title: Set one 12-week outcome.
    text: Make it measurable and visible.
  - n: 2
    title: Define three milestone dates.
    text: What needs to exist by weeks 4, 8, and 12?
  - n: 3
    title: Use the daily three.
    text: Write only three important tasks each day.
  - n: 4
    title: Schedule feedback.
    text: Decide when a real person will test the work.
  - n: 5
    title: Run a weekly review.
    text: Keep, change, stop. Then plan the next seven days.
  build: Write one 12-week outcome and the first three milestones. Choose tomorrow's three tasks. Delete
    or postpone anything that does not serve the outcome.
  realityCheck: For paid projects, products, customer data, shipping, taxes, or contracts, work with a
    parent or guardian. A smart plan includes legal and safety checks, not just growth tasks.
  debrief:
  - What is your one outcome for the next 12 weeks?
  - Which current tasks are only making you feel busy?
  - When will reality test your plan?
- id: boss-decisions
  n: 7
  slug: boss-decisions
  title: Boss Decisions
  eyebrow: 'CHAPTER 07 / HILL REMIX: DECISION'
  subtitle: Make clear choices without confusing speed with recklessness.
  hillPrinciple: Decision
  printedPage: 28
  hillIdea:
    term: Decision
    text: Decide from facts and values, set a deadline, and get adult help when the stakes are real.
  story:
  - 'Jake is halfway through dinner when a message appears: Offer expires tonight. Guaranteed crypto system.
    Big creator fee.'
  - The payment is more than he has ever earned from one post.
  - Jake runs a small channel that explains money topics to students. The company sends a polished script,
    sample comments, and a countdown link. For about five minutes, he imagines the new laptop he could
    buy.
  - Then he reads the script again.
  - Do not mention risk. Call the returns "guaranteed." Earn extra for every follower who deposits.
  - 'Jake opens a decision page with four boxes: facts, values, worst case, and who else should check.
    The facts are vague. The pressure is obvious. The worst case is not one embarrassing post; it is friends
    losing money because they trusted him.'
  - He screenshots everything and shows it to a parent and a teacher. Both tell him to decline and save
    the evidence.
  - 'Jake sends one sentence: "I won''t promote a product I can''t verify."'
  - 'For ten minutes, it feels like he has thrown away an opportunity. Then he records a different video:
    "Three signs an online money offer wants your trust more than your questions."'
  - It becomes one of his most saved posts.
  - The real decision was not money versus no money. It was what his name would mean the next time someone
    saw it.
  hillRemix: 'Hill praised people who could make decisions and avoid endless hesitation. But "decide quickly"
    should never mean skipping facts or safety. The teen remix is: set a reasonable deadline, separate
    evidence from pressure, choose by values, and involve an adult when money, contracts, travel, health,
    or personal risk is involved.'
  whatItMeansNow: Good decisions often feel uncomfortable because every yes closes other doors. Clarity
    comes from naming the trade-off. The question is not "Which option feels easiest right now?" It is
    "Which option can I respect later?"
  play:
  - n: 1
    title: Name the decision.
    text: Write it as a clear choice, not a cloud of worries.
  - n: 2
    title: List verified facts.
    text: Separate what you know from what someone claims.
  - n: 3
    title: Run the values test.
    text: Which option matches the person you want to become?
  - n: 4
    title: Check the downside.
    text: Who could be harmed if this goes wrong?
  - n: 5
    title: Set the deadline and reviewer.
    text: Decide by a specific time, after the right person checks it.
  build: 'Take one decision you have been avoiding. Fill four boxes: Facts / Values / Downside / Reviewer.
    Set a decision time within 24 hours if the choice is low-risk; otherwise ask an adult first.'
  realityCheck: Urgency is a common manipulation tactic. Never send money, sign terms, share ID, meet
    strangers, or promote financial products without a parent or guardian and appropriate professional
    advice.
  debrief:
  - Which decision is staying vague because you have not written it down?
  - What pressure is being presented as urgency?
  - Which option protects trust, even if it pays less today?
- id: unstoppable
  n: 8
  slug: unstoppable
  title: Unstoppable
  eyebrow: 'CHAPTER 08 / HILL REMIX: PERSISTENCE'
  subtitle: Make persistence small enough to survive bad days.
  hillPrinciple: Persistence
  printedPage: 31
  hillIdea:
    term: Persistence
    text: Keep the direction, adjust the method, and protect your energy so you can continue.
  story:
  - Amber spends eight hours editing a video about exam stress.
  - It gets 143 views.
  - She deletes the analytics app, downloads it again twelve minutes later, and stares at the number as
    if refreshing hard enough might change it. In the class group chat, someone posts, "Amber still doing
    the motivational channel?" followed by a skull emoji.
  - She opens the delete button.
  - 'Then a private message arrives from a student she barely knows: "Used your breathing reset before
    my mock today. It actually helped."'
  - Amber reads it three times.
  - 'Her original goal was not "be famous." It was "help students feel less alone under pressure." So
    she builds a minimum viable streak: one useful post each weekday for thirty days, but not every post
    has to be a cinematic edit. A full video counts. A fifteen-second reset counts. One clear graphic
    counts.'
  - Each Sunday she reviews saves, questions, and how exhausted the work made her.
  - By day twelve, the short study-reset clips are being saved more than the speeches she spent hours
    polishing. She follows the evidence. By day thirty, two teachers are sharing the clips in school groups.
  - Her audience is still small.
  - Her system is not.
  - Amber does not win by repeating the same tactic forever. She wins by refusing to disappear while giving
    herself permission to adapt.
  hillRemix: 'For Hill, Persistence was sustained effort toward a definite purpose. Persistence is not
    repeating a broken tactic forever. It is keeping the purpose while learning, resting, and adapting.
    The teen version is built on minimums: the smallest useful action you can still complete on a difficult
    day.'
  whatItMeansNow: 'Algorithms, grades, and other people''s reactions can hide progress. Track inputs you
    control: practice sessions, conversations, drafts, offers made, or products shipped. Then use outcomes
    as feedback, not as a verdict on your identity.'
  play:
  - n: 1
    title: Protect the purpose.
    text: Write why the goal matters beyond likes or praise.
  - n: 2
    title: Set a minimum.
    text: Define the smallest action that keeps the streak alive.
  - n: 3
    title: Separate rest from quitting.
    text: Schedule recovery before exhaustion chooses for you.
  - n: 4
    title: Review the method.
    text: Ask what is working, not whether you are talented.
  - n: 5
    title: Celebrate evidence.
    text: Mark each completed day and each lesson learned.
  build: Choose one seven-day streak and define the minimum version. Complete day one now. Put the tracking
    boxes somewhere you will see them.
  realityCheck: Burnout is not proof of ambition. If a goal is harming sleep, health, school, or relationships,
    change the system and talk to a trusted adult. Persistence includes knowing when to pause or choose
    a safer path.
  debrief:
  - What purpose is bigger than the current numbers?
  - What is the minimum action for your hardest day?
  - Which part of the method should change while the direction stays?
- id: squad-goals
  n: 9
  slug: squad-goals
  title: Squad Goals
  eyebrow: 'CHAPTER 09 / HILL REMIX: THE MASTER MIND'
  subtitle: Build a small team where skills and honesty multiply.
  hillPrinciple: The Master Mind
  printedPage: 34
  hillIdea:
    term: The Master Mind
    text: Work with people who challenge, support, and complement you - not just people who agree.
  story:
  - At 1:17 a.m., Sam is fixing a broken headline on his gaming-news site while answering Discord messages
    and exporting a thumbnail.
  - The site is his idea, which has slowly become his excuse for doing everything alone.
  - He invites Nora, who loves short-form video, and Lucas, who is weirdly calm around spreadsheets. Their
    first call is painful. Everyone says, "We should..." and nobody says, "I'll do it."
  - 'So they make three rules: one shared 30-day goal, one owner for every task, and one twenty-minute
    check-in each week.'
  - Sam handles the site. Nora turns stories into clips. Lucas tracks deadlines and the topics people
    actually search for. In the first month, traffic nearly doubles. Sam also sleeps before 1 a.m. more
    than once.
  - Then the squad proves its real value.
  - Sam drafts a breaking story from an account that looks official. Nora asks, "Where did this start?"
    Lucas traces the screenshot back to a satire page. They kill the post before it goes live.
  - The team does not just make Sam faster. It protects the quality of the work - and sometimes protects
    him from himself.
  - A good squad is not a group chat full of fire emojis. It is people who make the goal clearer, the
    work safer, and the truth harder to ignore.
  hillRemix: Hill called coordinated effort between people a Master Mind. The useful idea is not secret
    energy. It is combined knowledge, accountability, perspective, and momentum. A good squad creates
    a result no member could create as easily alone.
  whatItMeansNow: 'The biggest team is rarely the best team. Start with two or three people who share
    the goal and bring different strengths. Friendship helps, but clarity matters more: roles, deadlines,
    communication, credit, and what happens when someone cannot deliver.'
  play:
  - n: 1
    title: Choose the shared goal.
    text: One measurable result for the next 30 days.
  - n: 2
    title: Map strengths.
    text: Builder, storyteller, researcher, operator, designer, connector.
  - n: 3
    title: Assign one owner.
    text: Every task has one person responsible, even when others help.
  - n: 4
    title: Meet for 20 minutes.
    text: Wins, blocks, next commitments. No endless group chat.
  - n: 5
    title: Protect trust.
    text: Give credit, keep promises, challenge ideas respectfully, and admit mistakes early.
  build: 'Invite one or two people to a 20-minute build call. Bring one goal and ask: "What could we create
    together in 30 days?" End with one task per person.'
  realityCheck: Online collaboration needs boundaries. Do not share your address, school schedule, private
    documents, passwords, or financial details. Use parent-approved platforms and involve an adult before
    meeting anyone in person.
  debrief:
  - Which task are you doing alone that needs another strength?
  - Who makes your thinking sharper rather than simply louder?
  - What rule would protect trust in your squad?
- id: fearless
  n: 10
  slug: fearless
  title: Fearless
  eyebrow: 'CHAPTER 10 / HILL REMIX: OUTWITTING THE GHOSTS OF FEAR'
  subtitle: Courage is action with fear in the room.
  hillPrinciple: Outwitting The Ghosts Of Fear
  printedPage: 37
  hillIdea:
    term: Outwitting The Ghosts Of Fear
    text: Name the fear, separate danger from discomfort, and climb a safe courage ladder.
  story:
  - Indy has recorded the same poem nine times.
  - Draft 01. Draft 02. Draft FINAL. Draft FINAL2.
  - Every version ends in her camera roll because she can already hear the comments classmates might make.
    The poem is about feeling invisible in a crowded school. Posting it feels like volunteering to be
    judged.
  - So Indy builds a fear ladder.
  - 'Step one: read it alone. Step two: send audio to a trusted cousin. Step three: post one line as text.
    Step four: share a video to Close Friends. Step five: publish the full performance.'
  - The ladder almost feels too easy. That is why she keeps climbing it.
  - When Indy reaches step five, her hands still shake. She posts the video, turns off notifications,
    and leaves her phone in another room for an hour.
  - When she returns, there are kind comments, one rude emoji, and no social apocalypse.
  - A teacher later asks whether she would perform at a school event. Indy's first impulse is to say no.
    Instead she says, "Can I answer tomorrow?" She thinks, talks to someone she trusts, and accepts.
  - Fearless did not mean feeling nothing.
  - It meant fear was allowed in the room, but it no longer got the only vote.
  hillRemix: 'Hill wrote about the "ghosts" that keep people from acting: fears around poverty, criticism,
    health, love, age, and death. Teen fear often shows up as rejection, failure, embarrassment, disappointing
    people, money pressure, and uncertainty. The principle still works: name the fear so it stops operating
    invisibly.'
  whatItMeansNow: Not every fear should be conquered. Fear can warn you about real danger. The skill is
    telling the difference between a growth edge and an unsafe situation. Growth fear says, "This matters
    and I might look awkward." Danger says, "I may be harmed, pressured, trapped, or unable to leave."
    Choose courage only inside safety.
  play:
  - n: 1
    title: Name the exact fear.
    text: '"I am afraid that..." Specific fear is easier to test.'
  - n: 2
    title: Rate the risk.
    text: Is this discomfort, social risk, financial risk, or physical danger?
  - n: 3
    title: Build five steps.
    text: Start with a step that creates mild discomfort, not panic.
  - n: 4
    title: Add support.
    text: Choose who will know, help, or be present.
  - n: 5
    title: Recover on purpose.
    text: After the action, breathe, walk, journal, or talk. Teach your body that the moment ended.
  build: Write one fear ladder with five steps. Complete step one today. Tell one trusted person what
    the final step is.
  realityCheck: Never use courage language to pressure yourself into unsafe contact, substances, risky
    stunts, financial bets, or secrecy from trusted adults. Anxiety and panic are real and treatable;
    professional help is strength.
  debrief:
  - Which fear has been making decisions without being named?
  - Is the situation uncomfortable or actually unsafe?
  - What is the smallest safe step that still counts as courage?
- id: money-mindset
  n: 11
  slug: money-mindset
  title: Money Mindset
  eyebrow: 'CHAPTER 11 / HILL REMIX: RICHES MADE PRACTICAL'
  subtitle: Give every euro, pound, or dollar a job before it disappears.
  hillPrinciple: Riches Made Practical
  printedPage: 40
  hillIdea:
    term: Riches Made Practical
    text: Money is a tool for choices. Learn the basics before chasing speed, status, or investing hype.
  story:
  - Devin gets paid 160 euros for a weekend editing job.
  - Six days later, his balance is 12.43.
  - He remembers food, a game, and a hoodie. He does not remember deciding to spend almost everything.
    The money just dissolved through small taps and one "I deserve it" purchase.
  - 'Instead of turning the week into a guilt speech, Devin tracks every amount for seven days. Then he
    creates three buckets:'
  - Spend - life now. Save - safety and planned goals. Build - skills, tools, and small projects that
    may create future options.
  - 'The percentages change depending on the month. The rule does not: when money arrives, he chooses
    the split before opening a shopping app.'
  - His first target is not "financial freedom." It is a 200-euro buffer and enough Build money for a
    better microphone. With a parent, he compares account options and makes a spreadsheet simple enough
    to update from his phone.
  - Three months later, Devin is not rich. He has skipped some purchases, made one bad estimate, and restarted
    twice.
  - But a surprise expense no longer empties everything. A payment no longer feels like permission to
    stop thinking.
  - Control begins when money stops being a mystery.
  hillRemix: 'Hill wrote about riches as the outcome of purpose, belief, planning, and persistence. A
    modern teen edition needs a missing bridge: basic money management. Mindset without a system can become
    hype. The system is simple - know what arrives, decide where it goes, protect yourself from scams,
    and use money to create options.'
  whatItMeansNow: Money is emotional. It can carry family stress, comparison, freedom, shame, or status.
    Numbers help because they make choices visible. Start with tracking and a small buffer before thinking
    about investing. Never confuse an exciting story with a safe financial product.
  play:
  - n: 1
    title: Track for seven days.
    text: Record every amount without judgment.
  - n: 2
    title: Create three buckets.
    text: Spend / Save / Build. Choose percentages that fit your reality with adult guidance.
  - n: 3
    title: Pay the future first.
    text: Move Save and Build money when income arrives, not after spending.
  - n: 4
    title: Set one 90-day target.
    text: A buffer, equipment, course, or project budget.
  - n: 5
    title: Use a scam pause.
    text: No money decision under pressure. Verify, wait, and ask an adult.
  build: Look at your last ten purchases or write down all spending for today. Sort each item into Spend,
    Save, or Build. Choose one 90-day target and calculate the weekly amount.
  realityCheck: This book is educational, not financial advice. Under-18 accounts, taxes, investing, online
    payments, and paid work rules vary by country. Use a parent or guardian and qualified local guidance.
    Never borrow or invest money you cannot afford to lose.
  debrief:
  - Where does your money actually go?
  - Which purchase gives real value and which is mostly comparison?
  - What small buffer or Build goal would increase your freedom?
- id: vibe-check
  n: 12
  slug: vibe-check
  title: Vibe Check
  eyebrow: 'CHAPTER 12 / HILL REMIX: THE BRAIN: BROADCASTING & RECEIVING'
  subtitle: Your reputation is the signal you repeat, not the image you perform.
  hillPrinciple: 'The Brain: Broadcasting & Receiving'
  printedPage: 43
  hillIdea:
    term: 'The Brain: Broadcasting & Receiving'
    text: Share useful, honest energy consistently and listen to what comes back.
  story:
  - Eli has twenty podcast names in his Notes app.
  - He has cover art, possible guests, an intro track, and exactly zero episodes.
  - The problem is not a lack of ideas. It is that Eli keeps waiting to sound like someone who already
    knows what he is doing.
  - 'One night, he posts a thirty-second voice note: "I want to make something about growing up online,
    but I keep waiting to feel qualified. Maybe the honest first episode is about that."'
  - The audio is uneven. A chair squeaks halfway through.
  - Three friends reply with questions. A teacher offers a quiet room to record. A student from another
    year messages, "Can you talk about comparison? I thought it was only me."
  - Eli realizes the signal was never "I am an expert." It was "I care about this, and I am willing to
    explore it honestly."
  - He publishes a five-minute pilot. The intro is too long. He says "like" constantly. Eleven people
    listen to the end.
  - 'He improves one thing per episode. After eight weeks, the podcast is still small, but listeners know
    what it stands for: curiosity, honesty, and no pretending.'
  - A vibe is not a font, filter, or playlist.
  - It is the pattern people can trust you to repeat.
  hillRemix: 'Hill used the radio technology of his era as a metaphor for the Brain broadcasting and receiving
    thought. Treat that as a metaphor, not a scientific law. The modern useful idea is that people respond
    to repeated signals: what you talk about, make, notice, and support. Your signal shapes your reputation
    and the opportunities people think to send you.'
  whatItMeansNow: A vibe is not an aesthetic. It is a pattern. If your posts say growth but your behavior
    says disrespect, people trust the behavior. If you share only perfect results, people may admire you
    but not connect. Useful signals are clear, honest, and consistent.
  play:
  - n: 1
    title: Choose three signal words.
    text: 'For example: curious, useful, kind.'
  - n: 2
    title: Share one real thing.
    text: A lesson, question, process, or small win.
  - n: 3
    title: Invite response.
    text: Ask a specific question rather than begging for engagement.
  - n: 4
    title: Listen.
    text: Replies reveal language, problems, and people you can help.
  - n: 5
    title: Repeat without performing.
    text: Consistency builds trust; pretending drains it.
  build: Choose your three signal words. Publish or privately share one 30-second idea that matches them.
    Ask one clear question and write down what returns.
  realityCheck: Do not trade privacy for attention. Avoid posting your location, school schedule, private
    conflicts, or vulnerable information you may regret. Honest does not mean unprotected.
  debrief:
  - What three words describe the signal you want to repeat?
  - Where does your online image differ from your real behavior?
  - What useful conversation could you start this week?
- id: intuition-flow
  n: 13
  slug: intuition-flow
  title: Intuition Flow
  eyebrow: 'CHAPTER 13 / HILL REMIX: THE SIXTH SENSE'
  subtitle: Let your gut suggest the direction, then let evidence test the route.
  hillPrinciple: The Sixth Sense
  printedPage: 46
  hillIdea:
    term: The Sixth Sense
    text: Notice quiet pattern recognition, but verify high-stakes decisions with facts and trusted people.
  story:
  - 'At 3:07 a.m., Kai opens his Notes app and types: One sensor. One garden bed. Stop wasting water.'
  - The idea has been following him for weeks. It is not on his official school-project list, but he sketches
    it during lessons and thinks about it while brushing his teeth. Part of him wants to call that feeling
    destiny.
  - Instead, he calls it a reason to test.
  - 'Kai knows basic coding, hates seeing the community garden overwatered, and already knows the coordinator.
    He builds the smallest version he can: one cheap moisture sensor, one plant bed, and one dashboard.'
  - The first readings are useless. Rain gets into the housing. The graph says the soil is dry while Kai
    is standing in mud.
  - A science teacher helps him protect the sensor. Then the garden coordinator looks at the dashboard
    and says, "This is cool, but volunteers won't check another app. Can it text us?"
  - Kai changes the prototype.
  - His gut was not correct about the final solution. It was useful about the direction. The idea contained
    a real problem, a real interest, and a real person he could help.
  - Intuition opened the door.
  - A small test let reality into the room.
  hillRemix: Hill called intuition the Sixth Sense - ideas or judgments that seem to arrive before conscious
    reasoning finishes. A grounded teen version treats intuition as a possible mix of pattern recognition,
    experience, values, and emotion. It can start a test. It should not end an investigation.
  whatItMeansNow: Intuition is strongest in areas where you have experience and feedback. It is weakest
    when you are excited, afraid, manipulated, or missing information. Gut feelings about creative direction
    can be useful. Gut feelings about money transfers, medical choices, strangers, or major commitments
    need verification.
  play:
  - n: 1
    title: Capture the ping.
    text: Write the idea before explaining it away.
  - n: 2
    title: Ask why it may be appearing.
    text: Experience? Values? Fear? Pressure?
  - n: 3
    title: Design a reversible test.
    text: What can you try cheaply and safely?
  - n: 4
    title: Check the data.
    text: What did the test and other people reveal?
  - n: 5
    title: Scale only after verification.
    text: The bigger the downside, the more evidence and adult input you need.
  build: Write down one idea or decision that keeps returning. Design a test under one hour or ten euros/pounds/dollars.
    For anything higher-risk, replace the test with a conversation with a trusted adult.
  realityCheck: Anxiety can feel like intuition because both can be physical. Anxiety often repeats broad
    danger signals; intuition is usually quieter and specific. When feelings are intense or persistent,
    slow down and seek support.
  debrief:
  - Which idea keeps returning without needing attention or applause?
  - What is the smallest reversible test?
  - What evidence would make you stop, change, or continue?
- id: mindful-tech
  n: 14
  slug: mindful-tech
  title: Mindful Tech
  eyebrow: 'CHAPTER 14 / HILL REMIX: THE SUBCONSCIOUS MIND'
  subtitle: Own your attention before the algorithm rents it out.
  hillPrinciple: The Subconscious Mind
  printedPage: 49
  hillIdea:
    term: The Subconscious Mind
    text: Protect what repeatedly enters your mind, and use technology on purpose.
  story:
  - Anna's weekly screen-time report says 8 hours 41 minutes a day.
  - She screenshots it, laughs, and almost posts it as a joke.
  - That evening, her dad asks her a question during dinner. Anna says "yeah" without hearing it because
    a notification has pulled her back into analytics. The look on his face makes the number feel less
    funny.
  - Her creator account is growing, but the work that once felt exciting now feels like being permanently
    on call. So Anna runs a seven-day Signal/Noise audit.
  - 'Signal is tech with a purpose and an end point: editing, learning, messaging a real friend, publishing
    something she made. Noise is the third analytics check, the automatic app switch, and the scroll she
    cannot explain afterward.'
  - Anna turns off every non-human notification. She sets two creator blocks. She charges her phone outside
    the bedroom and keeps a paper list of offline things to do when boredom hits.
  - Nothing dramatic happens. She does not delete the internet or become perfectly disciplined.
  - She misses a trend. She sleeps better. She finishes an edit faster. She notices a conversation while
    it is happening.
  - Her next videos feel stronger because she is living enough life to have something worth posting.
  - The goal was never less technology.
  - It was more choice.
  hillRemix: 'Hill believed repeated thoughts reach the Subconscious Mind and influence behavior. Whatever
    language you use for it, the practical truth is clear: repeated inputs shape attention, mood, expectations,
    and habits. Your feed is not neutral. Curate it like part of your environment.'
  whatItMeansNow: The goal is not zero screen time. Technology can teach, connect, create, and earn. The
    goal is intentionality. Signal has a purpose and an end point. Noise starts without a decision and
    continues without satisfaction.
  play:
  - n: 1
    title: Audit.
    text: List your top five apps and the feeling after using each.
  - n: 2
    title: Label Signal or Noise.
    text: Be specific; the same app can be both.
  - n: 3
    title: Remove triggers.
    text: Turn off non-human notifications and move distracting apps.
  - n: 4
    title: Create in blocks.
    text: Use planned periods for learning or building, then stop.
  - n: 5
    title: Schedule recovery.
    text: Protect sleep, movement, meals, people, and offline boredom.
  build: Turn off non-human notifications for 24 hours. Create one 30-minute Signal block and one 30-minute
    offline block. Notice the difference in your energy.
  realityCheck: If online use is affecting sleep, eating, school, relationships, or your ability to stop,
    tell a trusted adult. Harassment, threats, sexual messages, or blackmail should be reported immediately;
    do not handle them alone.
  debrief:
  - Which app is most often Signal, and which is mostly Noise?
  - What trigger starts your most automatic scrolling?
  - What offline activity makes your online work better?
- id: real-rich
  n: 15
  slug: real-rich
  title: Real Rich
  eyebrow: 'CHAPTER 15 / HILL REMIX: DEFINITE PURPOSE - THE FULL SYSTEM'
  subtitle: Build money and freedom without becoming empty, fake, or owned by the chase.
  hillPrinciple: Definite Purpose - The Full System
  printedPage: 52
  hillIdea:
    term: Definite Purpose - The Full System
    text: Use your skills, time, relationships, money, and influence to build a life that matters.
  story:
  - Gabriel's phone lights up with a 600-euro payment for two local-business websites.
  - The first time that happened, he bought sneakers the same night. Then a better phone. Then gear he
    could explain as "an investment" even when it mostly looked good on his desk. Each unboxing felt amazing
    for less time than the one before it.
  - A younger student asks Gabriel for help with a school fundraiser page. Gabriel plans to give him twenty
    minutes. They spend the whole afternoon building it together.
  - The page launches that night. A week later, the fundraiser reaches its target.
  - The feeling lasts longer than anything Gabriel ordered.
  - 'He does not decide that money is shallow. Money bought his laptop, paid for courses, and gave him
    choices. He decides that money needs direction. At the end of each month, he asks three questions:'
  - What do I keep for stability? What do I grow through skills and tools? What do I give through time,
    knowledge, or money?
  - Some months, giving is teaching one person. Some months, it is a small percentage. Profit still matters.
    It is just no longer the whole scoreboard.
  - 'Gabriel''s definition of rich becomes harder to fake: skills he owns, freedom he feels, people he
    trusts, and impact that lasts after the notification disappears.'
  hillRemix: 'Hill''s system begins with a definite purpose and combines belief, knowledge, imagination,
    planning, decisions, persistence, people, attention, and intuition. The final teen remix is Real Rich:
    money is one form of wealth, not the only one. The point is to create options without losing yourself.'
  whatItMeansNow: 'A strong life has several currencies: skill, health, time, trusted relationships, money,
    and meaning. One currency can temporarily support another, but destroying all the others for money
    is not wealth. Build a dashboard wide enough to show the truth.'
  play:
  - n: 1
    title: Keep.
    text: Protect stability, privacy, health, and enough money for future choices.
  - n: 2
    title: Grow.
    text: Invest time and resources in skills, tools, and experiences that compound.
  - n: 3
    title: Give.
    text: Use time, knowledge, attention, or money to help beyond yourself.
  - n: 4
    title: Review monthly.
    text: Ask whether your current path is increasing freedom or just status.
  - n: 5
    title: Define enough.
    text: Decide what success is for this season so the chase does not become infinite.
  build: 'Create a one-page Real Rich dashboard with six headings: Skills / Health / Time / People / Money
    / Impact. Score each from 1 to 10. Choose one action for the lowest area.'
  realityCheck: You are not responsible for fixing your family's finances or proving your worth through
    income. Success that damages your health or safety is too expensive. Ask for help early.
  debrief:
  - Which kind of wealth are you overvaluing?
  - What does "enough" mean for the next 90 days?
  - What can you build that helps you and someone else?
