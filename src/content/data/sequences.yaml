- id: ninety-day
  title: From Skill To First Honest Income
  subtitle: The fastest safe path is not "find a hack." It is "become useful, prove it, offer it, improve
    it."
  printedPage: 55
  groups:
  - id: phase-1-build-proof-days-1-30
    heading: Phase 1 - Build Proof (Days 1-30)
    items:
    - Choose one useful skill. Websites, editing, design, tutoring, research, photography, automation,
      or another skill you can safely deliver.
    - Create three proof projects. They can be self-created, for school, or free pilots for people you
      know.
    - 'Publish a simple portfolio. One page: what you do, examples, who it helps, and how to contact you
      through a parent-approved channel.'
    - Ask ten people about the problem. Do not sell yet. Learn their language and what a useful result
      looks like.
  - id: phase-2-offer-a-tiny-result-days-31-60
    heading: Phase 2 - Offer A Tiny Result (Days 31-60)
    items:
    - Package one clear outcome. Not "I do AI." Try "I build a clean one-page site for a local club."
    - Run two or three low-risk pilots. Free or low-cost can make sense when the scope is small and the
      feedback is real.
    - Use a written scope. What is included, what is not, when it is due, and who approves it. A parent
      or guardian should review paid work.
    - Collect proof, not hype. Before/after, a short testimonial from a real client, and what you learned.
  - id: phase-3-earn-and-improve-days-61-90
    heading: Phase 3 - Earn And Improve (Days 61-90)
    items:
    - Set a starter price based on scope. Avoid income promises and do not underprice unlimited revisions.
    - Ask for introductions. One satisfied person can introduce you to two more.
    - Track time and costs. Revenue is not profit. Your time is real even when you are young.
    - Raise quality before complexity. Improve the same offer before launching five services.
    - Split the money. Spend / Save / Build, with adult guidance.
